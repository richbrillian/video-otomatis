name: Buat Video Otomatis

on:
  schedule:
    # 3x sehari: 05:00, 12:00, 19:00 WIB (= 22:00, 05:00, 12:00 UTC)
    - cron: "0 22,5,12 * * *"

  workflow_dispatch:
    inputs:
      jumlah:
        description: "Jumlah video yang dibuat sekali jalan"
        default: "1"

jobs:
  buat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang FFmpeg, font, dan library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sSL -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          pip install -q requests

      - name: Buat video
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MAX_PER_RUN: ${{ github.event.inputs.jumlah || '1' }}
        run: python buat_video.py
